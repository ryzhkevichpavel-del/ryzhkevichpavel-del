name: Tihiy Bereg build and verification

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'tihiy-bereg/**'
      - 'bootstrap_tihiy_bereg.py'
      - 'bootstrap_parts/**'
      - 'ci_patch.py'
      - '.github/workflows/tihiy-bereg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.1-stable
      PROJECT_DIR: tihiy-bereg
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Materialize and patch readable project source
        run: |
          python3 bootstrap_tihiy_bereg.py
          python3 ci_patch.py

      - name: Publish readable source files to the project branch
        shell: bash
        run: |
          git config user.name "Tihiy Bereg CI"
          git config user.email "actions@users.noreply.github.com"
          git add tihiy-bereg
          if ! git diff --cached --quiet; then
            git commit -m "Materialize verified Godot source tree"
            git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - name: Install runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils unzip zip

      - name: Download Godot and official export templates
        run: |
          curl -L --fail --retry 5 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /tmp/godot/godot
          chmod +x /tmp/godot/godot
          curl -L --fail --retry 5 -o /tmp/templates.tpz "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          rm -rf /tmp/export-templates
          mkdir -p /tmp/export-templates "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          cp -a /tmp/export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"
          /tmp/godot/godot --version

      - name: Generate deterministic textures, audio and icon
        run: python3 "$PROJECT_DIR/tools/generate_assets.py"

      - name: Import and parse the complete project
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --audio-driver Dummy --path "$PROJECT_DIR" --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Shader compilation failed|Failed loading resource" /tmp/import.log

      - name: Simulation tests
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --audio-driver Dummy --path "$PROJECT_DIR" -s res://tests/test_simulation.gd 2>&1 | tee /tmp/test-simulation.log
          grep -q "SIMULATION_TEST_OK" /tmp/test-simulation.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|Assertion failed" /tmp/test-simulation.log

      - name: Integration tests
        run: |
          set -o pipefail
          /tmp/godot/godot --headless --audio-driver Dummy --path "$PROJECT_DIR" -s res://tests/test_integration.gd 2>&1 | tee /tmp/test-integration.log
          grep -q "INTEGRATION_TEST_OK" /tmp/test-integration.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|Assertion failed" /tmp/test-integration.log

      - name: Real OpenGL smoke test and screenshot
        run: |
          set -o pipefail
          mkdir -p "$PROJECT_DIR/build"
          timeout 240s xvfb-run -a -s "-screen 0 1600x900x24" /tmp/godot/godot --path "$PROJECT_DIR" --resolution 1600x900 -- --capture --quit-after-capture 2>&1 | tee /tmp/opengl.log
          grep -q "CAPTURE_MODE_STARTED" /tmp/opengl.log
          grep -q "CAPTURE_RESULT=0" /tmp/opengl.log
          ! grep -E "SCRIPT ERROR|Parse Error|Shader compilation failed|Invalid call|Failed loading resource" /tmp/opengl.log
          test -s "$PROJECT_DIR/build/capture.png"
          file "$PROJECT_DIR/build/capture.png"

      - name: Export Windows x64
        run: |
          set -o pipefail
          mkdir -p "$PROJECT_DIR/build"
          /tmp/godot/godot --headless --audio-driver Dummy --path "$PROJECT_DIR" --export-release "Windows Desktop" build/TihiyBereg.exe 2>&1 | tee /tmp/export.log
          ! grep -E "SCRIPT ERROR|Parse Error|Shader compilation failed|Failed to export" /tmp/export.log
          test -s "$PROJECT_DIR/build/TihiyBereg.exe"
          cp "$PROJECT_DIR/README.md" "$PROJECT_DIR/build/README.md"
          cp "$PROJECT_DIR/LICENSE" "$PROJECT_DIR/build/LICENSE.txt"
          (cd "$PROJECT_DIR/build" && zip -9 "Tihiy-Bereg-2.0-Windows-x64.zip" TihiyBereg.exe README.md LICENSE.txt)
          sha256sum "$PROJECT_DIR/build/TihiyBereg.exe" "$PROJECT_DIR/build/Tihiy-Bereg-2.0-Windows-x64.zip" > "$PROJECT_DIR/build/SHA256.txt"

      - name: Package verified source
        run: |
          zip -qr "$PROJECT_DIR/build/Tihiy-Bereg-2.0-Source.zip" "$PROJECT_DIR" -x "$PROJECT_DIR/.godot/*" "$PROJECT_DIR/build/TihiyBereg.exe" "$PROJECT_DIR/build/Tihiy-Bereg-2.0-Windows-x64.zip"

      - name: Upload Windows game
        uses: actions/upload-artifact@v4
        with:
          name: Tihiy-Bereg-2.0-Windows-x64
          path: |
            tihiy-bereg/build/Tihiy-Bereg-2.0-Windows-x64.zip
            tihiy-bereg/build/TihiyBereg.exe
            tihiy-bereg/build/SHA256.txt
          if-no-files-found: error
          compression-level: 0

      - name: Upload verified screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Tihiy-Bereg-2.0-Capture
          path: tihiy-bereg/build/capture.png
          if-no-files-found: error
          compression-level: 0

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: Tihiy-Bereg-2.0-Source
          path: tihiy-bereg/build/Tihiy-Bereg-2.0-Source.zip
          if-no-files-found: error
          compression-level: 0
